<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="theme-color" content="#14161a">
<title>Deck Agent</title>
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<style>
  :root {
    --bg: #f4f2ee; --surface: #ffffff; --surface-2: #ebe8e2; --text: #1d1f22; --muted: #6b6f76;
    --line: #dcd8d0; --accent: #c4633f; --accent-text: #ffffff; --ok: #2f7d4f; --warn: #a3621b;
    --err: #b3392f; --user: #2b3440; --user-text: #f3f4f6; --code: #efece6;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #14161a; --surface: #1d2026; --surface-2: #262a31; --text: #e8e9eb; --muted: #9298a1;
      --line: #30343c; --accent: #e07a52; --accent-text: #1a0f0a; --ok: #5fbf85; --warn: #e0a457;
      --err: #ef7a6f; --user: #33404f; --user-text: #f3f4f6; --code: #15171b;
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg); color: var(--text);
    font: 16px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    display: flex; flex-direction: column; height: 100dvh;
  }
  header {
    display: flex; align-items: center; gap: 10px; padding: 12px 16px;
    padding-top: max(12px, env(safe-area-inset-top));
    border-bottom: 1px solid var(--line); background: var(--surface);
  }
  header h1 { font-size: 17px; margin: 0; font-weight: 650; letter-spacing: -0.01em; white-space: nowrap; }
  header .ghost { white-space: nowrap; }
  @media (max-width: 380px) { #mode { display: none; } }
  .pill { font-size: 12px; padding: 3px 9px; border-radius: 999px; background: var(--surface-2); color: var(--muted); white-space: nowrap; }
  .status { display: flex; align-items: center; gap: 6px; font-size: 13px; color: var(--muted); margin-left: auto; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--ok); }
  .busy .dot { background: var(--accent); animation: pulse 1s infinite alternate; }
  .offline .dot { background: var(--err); }
  @keyframes pulse { to { opacity: .3; } }
  button { font: inherit; cursor: pointer; border: 0; border-radius: 10px; }
  .ghost { background: transparent; color: var(--muted); padding: 6px 8px; font-size: 14px; }
  .ghost:hover { color: var(--text); background: var(--surface-2); }

  main { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 10px; }
  .wrap { width: 100%; max-width: 720px; margin: 0 auto; display: flex; flex-direction: column; gap: 10px; }
  .msg { padding: 10px 13px; border-radius: 14px; max-width: 88%; overflow-wrap: anywhere; }
  .msg.user { align-self: flex-end; background: var(--user); color: var(--user-text); border-bottom-right-radius: 4px; white-space: pre-wrap; }
  .msg.assistant { align-self: flex-start; background: var(--surface); border: 1px solid var(--line); border-bottom-left-radius: 4px; }
  .msg.assistant p { margin: 0 0 6px; } .msg.assistant p:last-child { margin: 0; }
  code { font-family: ui-monospace, "Cascadia Mono", Menlo, monospace; font-size: 13px; background: var(--code); padding: 1px 5px; border-radius: 5px; }
  pre { background: var(--code); padding: 10px; border-radius: 8px; overflow-x: auto; margin: 6px 0; }
  pre code { padding: 0; background: none; }
  .tool { align-self: flex-start; font-size: 13px; color: var(--muted); max-width: 100%; }
  .tool summary { cursor: pointer; list-style: none; display: flex; gap: 6px; align-items: baseline; }
  .tool summary::-webkit-details-marker { display: none; }
  .tool .cmd { font-family: ui-monospace, Menlo, monospace; color: var(--text); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 70vw; }
  .tool .mark { width: 14px; flex: none; }
  .tool.failed .mark { color: var(--err); }
  .tool pre { font-size: 12px; max-height: 240px; white-space: pre-wrap; }
  .card { align-self: stretch; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px; }
  .card.approval { border-color: var(--warn); }
  .card h3 { margin: 0 0 6px; font-size: 14px; color: var(--warn); font-weight: 650; }
  .card .cmd { font-family: ui-monospace, Menlo, monospace; font-size: 13px; background: var(--code); padding: 8px; border-radius: 8px; white-space: pre-wrap; overflow-wrap: anywhere; }
  .actions { display: flex; gap: 8px; margin-top: 10px; }
  .actions button { flex: 1; padding: 12px; font-weight: 600; }
  .allow { background: var(--accent); color: var(--accent-text); }
  .deny { background: var(--surface-2); color: var(--text); }
  .resolved { font-size: 13px; color: var(--muted); margin-top: 8px; }
  .error { color: var(--err); font-size: 14px; align-self: flex-start; }
  .note { color: var(--muted); font-size: 13px; text-align: center; }

  .empty { margin: auto; text-align: center; color: var(--muted); padding: 24px 0; }
  .empty h2 { color: var(--text); font-size: 20px; margin: 0 0 6px; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin-top: 16px; }
  .chip { background: var(--surface); border: 1px solid var(--line); color: var(--text); padding: 8px 12px; border-radius: 999px; font-size: 14px; }
  .pair { display: flex; gap: 16px; align-items: center; text-align: left; margin-top: 22px; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 14px; }
  .pair #qr { background: #fff; padding: 8px; border-radius: 8px; flex: none; }
  .pair code { word-break: break-all; }

  footer { border-top: 1px solid var(--line); background: var(--surface); padding: 10px 16px; padding-bottom: max(10px, env(safe-area-inset-bottom)); }
  .composer { max-width: 720px; margin: 0 auto; display: flex; gap: 8px; align-items: flex-end; }
  textarea {
    flex: 1; resize: none; font: inherit; color: var(--text); background: var(--bg); border: 1px solid var(--line);
    border-radius: 12px; padding: 10px 12px; max-height: 160px; min-height: 44px;
  }
  textarea:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
  .send { background: var(--accent); color: var(--accent-text); padding: 0 18px; height: 44px; font-weight: 600; }
  .stop { background: var(--err); color: #fff; }
  .hint { max-width: 720px; margin: 6px auto 0; font-size: 12px; color: var(--muted); }
  .mic {
    width: 44px; height: 44px; flex: none; border-radius: 50%; background: var(--surface-2); color: var(--text);
    display: none; align-items: center; justify-content: center; touch-action: none; user-select: none;
  }
  .mic svg { width: 22px; height: 22px; }
  .voice .mic { display: flex; }
  .mic.listening { background: var(--err); color: #fff; animation: pulse 0.8s infinite alternate; }
  .mic.working { background: var(--surface-2); color: var(--muted); animation: pulse 0.5s infinite alternate; }
  /* App mode (Steam / Gaming Mode): bigger targets for the touchscreen and trackpad */
  .app { font-size: 18px; }
  .app .mic { width: 64px; height: 64px; }
  .app .mic svg { width: 30px; height: 30px; }
  .app textarea, .app .send { min-height: 64px; height: auto; }
  .app .chip { padding: 12px 16px; font-size: 16px; }

  .meta { align-self: flex-start; font-size: 12px; color: var(--muted); margin: -4px 0 4px 4px; }
  .footrow { max-width: 720px; margin: 6px auto 0; display: flex; flex-wrap: wrap; gap: 4px 12px; align-items: center; }
  .footrow .hint { margin: 0; flex: 1 1 220px; min-width: 0; }
  .model { font-size: 12px; color: var(--muted); display: flex; align-items: center; gap: 6px; white-space: nowrap; }
  .model select {
    font: inherit; font-size: 13px; color: var(--text); background: var(--bg); border: 1px solid var(--line);
    border-radius: 8px; padding: 3px 6px;
  }
  .app .model select { font-size: 16px; padding: 6px 10px; }

  /* History drawer */
  .drawer { position: fixed; inset: 0; background: rgba(0, 0, 0, 0.45); display: flex; justify-content: flex-end; z-index: 10; }
  .drawer[hidden] { display: none; }
  .drawer-panel {
    width: min(420px, 100%); height: 100%; background: var(--surface); border-left: 1px solid var(--line);
    display: flex; flex-direction: column; padding: 14px 16px; padding-top: max(14px, env(safe-area-inset-top));
  }
  .drawer-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
  .drawer-head h2 { font-size: 17px; margin: 0; }
  #chatList { overflow-y: auto; display: flex; flex-direction: column; gap: 6px; margin-top: 10px; }
  .chat-item { display: flex; align-items: stretch; border: 1px solid var(--line); border-radius: 12px; background: var(--bg); }
  .chat-item.current { border-color: var(--accent); }
  .chat-open { flex: 1; min-width: 0; text-align: left; background: none; color: var(--text); padding: 10px 12px; }
  .chat-title { display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-weight: 600; font-size: 15px; }
  .chat-sub { display: block; font-size: 12px; color: var(--muted); margin-top: 2px; }
  .chat-del { background: none; color: var(--muted); padding: 0 14px; font-size: 18px; }
  .chat-del:hover { color: var(--err); }
  .app .chat-open { padding: 14px; }
  .app .chat-title { font-size: 17px; }
</style>
</head>
<body>
<header id="top">
  <h1>Deck Agent</h1>
  <span class="pill" id="mode">…</span>
  <span class="status"><span class="dot"></span><span id="statusText">Connecting</span></span>
  <button class="ghost" id="historyBtn" title="Recent chats">History</button>
  <button class="ghost" id="newChat" title="Start a new conversation">New chat</button>
</header>
<div class="drawer" id="drawer" hidden>
  <div class="drawer-panel" role="dialog" aria-label="Recent chats">
    <div class="drawer-head"><h2>Recent chats</h2><button class="ghost" id="drawerClose" type="button">Close</button></div>
    <button class="chip" id="drawerNew" type="button">+ New chat</button>
    <div id="chatList"></div>
  </div>
</div>
<main id="scroller"><div class="wrap" id="log"></div></main>
<footer>
  <form class="composer" id="form">
    <button class="mic" id="micBtn" type="button" title="Hold to talk (or tap to start and stop)" aria-label="Talk">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="2" width="6" height="12" rx="3"/><path d="M5 10a7 7 0 0 0 14 0M12 17v5M8 22h8"/></svg>
    </button>
    <textarea id="input" rows="1" placeholder="Tell Claude what to do…" enterkeyhint="send"></textarea>
    <button class="send" id="sendBtn" type="submit">Send</button>
  </form>
  <div class="footrow">
    <label class="model">Model <select id="modelSel" aria-label="Claude model"></select><span id="authNote"></span></label>
    <div class="hint" id="hint">Tip: tap the mic on your phone's keyboard and just talk.</div>
  </div>
</footer>

<script>
(() => {
  // ---- pairing token: arrives once as ?t=..., then lives in this browser
  const params = new URLSearchParams(location.search);
  let token = "";
  try { token = params.get("t") || localStorage.getItem("deckToken") || ""; } catch (e) { token = params.get("t") || ""; }
  const appMode = params.get("app") === "1";
  if (appMode) document.body.classList.add("app");
  if (params.get("t")) {
    try { localStorage.setItem("deckToken", token); } catch (e) {}
    history.replaceState(null, "", location.pathname + (appMode ? "?app=1" : ""));
  }

  const $ = (id) => document.getElementById(id);
  const logEl = $("log"), scroller = $("scroller"), input = $("input"), sendBtn = $("sendBtn");
  let logId = "", lastId = 0, busy = false, info = {};
  const toolEls = {}, approvalEls = {};

  async function api(path, body) {
    const res = await fetch(path, {
      method: body ? "POST" : "GET",
      headers: { "Content-Type": "application/json", "X-Deck-Token": token },
      body: body ? JSON.stringify(body) : undefined,
    });
    if (res.status === 401) throw new Error("unauthorized");
    return { status: res.status, data: await res.json().catch(() => ({})) };
  }

  // ---- tiny, safe markdown: escape first, then code blocks, inline code, bold, paragraphs
  function esc(s) { return s.replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c])); }
  function md(text) {
    const blocks = [];
    let s = esc(text).replace(/```[\w-]*\n?([\s\S]*?)```/g, (_, code) => { blocks.push(code); return `\u0000${blocks.length - 1}\u0000`; });
    s = s.replace(/`([^`\n]+)`/g, "<code>$1</code>").replace(/\*\*([^*\n]+)\*\*/g, "<strong>$1</strong>");
    s = s.split(/\n{2,}/).map((p) => `<p>${p.replace(/\n/g, "<br>")}</p>`).join("");
    return s.replace(/<p>\u0000(\d+)\u0000<\/p>|\u0000(\d+)\u0000/g, (_, a, b) => `<pre><code>${blocks[a ?? b]}</code></pre>`);
  }

  function nearBottom() { return scroller.scrollHeight - scroller.scrollTop - scroller.clientHeight < 120; }
  function add(el) { const stick = nearBottom(); logEl.appendChild(el); if (stick) scroller.scrollTop = scroller.scrollHeight; return el; }
  function node(tag, cls, html) { const el = document.createElement(tag); if (cls) el.className = cls; if (html != null) el.innerHTML = html; return el; }

  function renderEmpty() {
    if (logEl.children.length) return;
    const empty = node("div", "empty", `<h2>What should I do?</h2><div>I'm running on your Steam Deck. Ask me to open things, move files or write scripts.</div>`);
    const chips = node("div", "chips");
    ["How much space is left?", "List my games", "What's on my SD card?", "Switch to Desktop Mode"].forEach((t) => {
      const b = node("button", "chip"); b.type = "button"; b.textContent = t; b.onclick = () => send(t); chips.appendChild(b);
    });
    empty.appendChild(chips);
    if (info.local && info.pair_url) {
      const pair = node("div", "pair", `<div id="qr"></div><div><strong>Use your phone</strong><br><span style="font-size:14px">Scan this on the same Wi-Fi, or open:</span><br><code>${esc(info.pair_url)}</code></div>`);
      empty.appendChild(pair);
      const s = document.createElement("script");
      s.src = "https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js";
      s.onload = () => { const q = document.getElementById("qr"); if (q) new QRCode(q, { text: info.pair_url, width: 132, height: 132 }); };
      s.onerror = () => { const q = document.getElementById("qr"); if (q) q.remove(); };
      document.head.appendChild(s);
    }
    empty.dataset.placeholder = "1";
    logEl.appendChild(empty);
  }
  function clearEmpty() { const e = logEl.querySelector("[data-placeholder]"); if (e) e.remove(); }

  function render(ev) {
    if (ev.type !== "state") clearEmpty();
    switch (ev.type) {
      case "user": add(node("div", "msg user")).textContent = ev.text; break;
      case "assistant": add(node("div", "msg assistant", md(ev.text))); break;
      case "tool": {
        const d = node("details", "tool");
        d.innerHTML = `<summary><span class="mark">⚙</span><span>${esc(ev.name)}</span><span class="cmd"></span></summary>`;
        d.querySelector(".cmd").textContent = ev.summary;
        toolEls[ev.tool_id] = add(d);
        break;
      }
      case "tool_result": {
        const d = toolEls[ev.tool_id];
        if (!d) break;
        d.querySelector(".mark").textContent = ev.ok ? "✓" : "✕";
        if (!ev.ok) d.classList.add("failed");
        if (ev.text) { const pre = node("pre"); pre.textContent = ev.text; d.appendChild(pre); }
        break;
      }
      case "approval": {
        const c = node("div", "card approval", `<h3>Claude wants to use ${esc(ev.name)}</h3><div class="cmd"></div>
          <div class="actions"><button class="allow" type="button">Allow</button><button class="deny" type="button">Deny</button></div>`);
        c.querySelector(".cmd").textContent = ev.summary;
        c.querySelector(".allow").onclick = () => answer(ev.approval_id, true);
        c.querySelector(".deny").onclick = () => answer(ev.approval_id, false);
        approvalEls[ev.approval_id] = add(c);
        if (navigator.vibrate) navigator.vibrate(150);
        break;
      }
      case "approval_resolved": {
        const c = approvalEls[ev.approval_id];
        if (!c) break;
        const acts = c.querySelector(".actions"); if (acts) acts.remove();
        const why = ev.reason === "timeout" ? "No answer in time, so it was denied." : ev.reason === "cancelled" ? "Cancelled." : ev.allowed ? "Allowed." : "Denied.";
        c.appendChild(node("div", "resolved")).textContent = why;
        break;
      }
      case "status": add(node("div", "note")).textContent = ev.text; break;
      case "error": add(node("div", "error")).textContent = "⚠ " + ev.text; break;
      case "state": setBusy(ev.busy); break;
      case "done": {
        const bits = [prettyModel(ev.model), ev.duration_ms ? (ev.duration_ms / 1000).toFixed(1) + " s" : ""].filter(Boolean);
        if (bits.length) add(node("div", "meta")).textContent = bits.join(" · ");
        break;
      }
    }
  }

  // "claude-sonnet-5-5" -> "Sonnet 5.5"
  function prettyModel(id) {
    const m = /claude-([a-z]+)-(\d+)(?:-(\d+))?/.exec(id || "");
    if (!m) return id || "";
    return m[1][0].toUpperCase() + m[1].slice(1) + " " + m[2] + (m[3] ? "." + m[3] : "");
  }

  function setBusy(b) {
    busy = b;
    $("top").classList.toggle("busy", b);
    $("statusText").textContent = b ? "Working" : "Ready";
    sendBtn.textContent = b ? "Stop" : "Send";
    sendBtn.classList.toggle("stop", b);
  }

  async function answer(id, allow) {
    const c = approvalEls[id];
    c && c.querySelectorAll(".actions button").forEach((b) => (b.disabled = true));
    await api("/api/approve", { approval_id: id, allow }).catch(() => {});
  }

  async function send(text) {
    text = (text || "").trim();
    if (!text) return;
    const { status, data } = await api("/api/send", { text });
    if (status === 409) render({ type: "error", text: data.error });
    else { input.value = ""; autosize(); }
  }

  async function poll() {
    for (;;) {
      try {
        const { data } = await api(`/api/events?after=${lastId}&log=${logId}`);
        if (data.log !== logId) { logId = data.log; lastId = 0; logEl.innerHTML = ""; }
        $("top").classList.remove("offline");
        data.events.forEach((ev) => { render(ev); lastId = Math.max(lastId, ev.id); });
        setBusy(data.busy);
        renderEmpty();
      } catch (e) {
        $("top").classList.add("offline");
        if (e.message === "unauthorized") {
          $("statusText").textContent = "Not paired";
          logEl.innerHTML = `<div class="empty"><h2>Not paired</h2><div>Open the link (or scan the QR code) shown on the Deck at <code>http://localhost:${location.port || 80}</code>.</div></div>`;
          return;
        }
        $("statusText").textContent = "Offline";
        await new Promise((r) => setTimeout(r, 3000));
      }
    }
  }

  function autosize() { input.style.height = "auto"; input.style.height = Math.min(input.scrollHeight, 160) + "px"; }
  input.addEventListener("input", autosize);
  input.addEventListener("keydown", (e) => {
    if (e.key === "Enter" && !e.shiftKey && !e.isComposing && matchMedia("(pointer: fine)").matches) { e.preventDefault(); $("form").requestSubmit(); }
  });
  $("form").addEventListener("submit", (e) => {
    e.preventDefault();
    if (busy) api("/api/stop", {}).catch(() => {});
    else send(input.value).catch(() => render({ type: "error", text: "Couldn't reach the Deck." }));
  });
  async function newChat() {
    if (busy) return render({ type: "error", text: "Stop the current task first." });
    await api("/api/new", {}).catch(() => {});  // the old chat stays in History
    closeDrawer();
  }
  $("newChat").onclick = newChat;

  // ---- history: the last 50 chats, saved on the Deck; opening one continues it
  const drawer = $("drawer");
  function closeDrawer() { drawer.hidden = true; }
  function ago(ts) {
    const s = Date.now() / 1000 - ts;
    if (s < 60) return "just now";
    if (s < 3600) return Math.floor(s / 60) + " min ago";
    if (s < 86400) return Math.floor(s / 3600) + " h ago";
    if (s < 172800) return "yesterday";
    return new Date(ts * 1000).toLocaleDateString(undefined, { day: "numeric", month: "short" });
  }
  async function openDrawer() {
    drawer.hidden = false;
    const list = $("chatList");
    list.textContent = "Loading…";
    const { data } = await api("/api/chats").catch(() => ({ data: { chats: [] } }));
    list.innerHTML = "";
    if (!data.chats.length) list.textContent = "No saved chats yet.";
    data.chats.forEach((c) => {
      const item = node("div", "chat-item" + (c.id === data.current ? " current" : ""));
      const open = node("button", "chat-open", `<span class="chat-title"></span><span class="chat-sub"></span>`);
      open.type = "button";
      open.querySelector(".chat-title").textContent = c.title || "New chat";
      const sub = [ago(c.updated), c.messages + (c.messages === 1 ? " message" : " messages"), c.model && info.models ? info.models[c.model] : ""];
      open.querySelector(".chat-sub").textContent = (c.id === data.current ? "Open now · " : "") + sub.filter(Boolean).join(" · ");
      open.onclick = async () => {
        if (c.id === data.current) return closeDrawer();
        const { status } = await api("/api/chats/open", { id: c.id });
        if (status === 409) return render({ type: "error", text: "Stop the current task before switching chats." });
        closeDrawer();
      };
      const del = node("button", "chat-del", "✕");
      del.type = "button";
      del.title = "Delete this chat";
      del.setAttribute("aria-label", "Delete chat");
      del.onclick = async () => {
        if (!confirm(`Delete "${c.title || "New chat"}"?`)) return;
        const { status } = await api("/api/chats/delete", { id: c.id });
        if (status === 409) return render({ type: "error", text: "Stop the current task first." });
        openDrawer();
      };
      item.append(open, del);
      list.appendChild(item);
    });
  }
  $("historyBtn").onclick = openDrawer;
  $("drawerClose").onclick = closeDrawer;
  $("drawerNew").onclick = newChat;
  drawer.addEventListener("click", (e) => { if (e.target === drawer) closeDrawer(); });
  addEventListener("keydown", (e) => { if (e.key === "Escape" && !drawer.hidden) closeDrawer(); });

  // ---- model picker (Claude Code aliases; the page shows the exact model after each reply)
  const modelSel = $("modelSel");
  const modelNotes = { sonnet: "Sonnet", opus: "Opus (strongest)", haiku: "Haiku (fastest)" };
  modelSel.title = "Sonnet: fast, light on your Pro limits. Opus: strongest, uses your limits faster. Haiku: fastest.";
  function fillModels(models, current) {
    modelSel.innerHTML = "";
    Object.keys(models || {}).forEach((key) => {
      const o = document.createElement("option");
      o.value = key;
      o.textContent = modelNotes[key] || models[key];
      modelSel.appendChild(o);
    });
    modelSel.value = current;
  }
  modelSel.onchange = async () => {
    const { data } = await api("/api/model", { model: modelSel.value }).catch(() => ({ data: {} }));
    if (data.model) modelSel.value = data.model;
  };

  // ---- voice: record here, transcribe with Whisper on the Deck, then send.
  // Browsers only allow the mic on secure pages, so this shows up on the Deck itself
  // (localhost), not on the phone (which has its own keyboard dictation).
  const micBtn = $("micBtn");
  const voiceHint = "Hold the mic (or F8) and talk. Or tap it to start and tap again to stop.";
  let rec = null, pressedAt = 0, stopWanted = false;

  async function startListening() {
    if (rec || micBtn.classList.contains("working")) return;
    stopWanted = false;
    try {
      const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
      const type = ["audio/webm;codecs=opus", "audio/ogg;codecs=opus", "audio/webm"].find((t) => MediaRecorder.isTypeSupported(t));
      const chunks = [];
      rec = new MediaRecorder(stream, type ? { mimeType: type } : undefined);
      const mime = rec.mimeType || "audio/webm";
      rec.ondataavailable = (e) => { if (e.data.size) chunks.push(e.data); };
      rec.onstop = () => {
        stream.getTracks().forEach((t) => t.stop());
        rec = null;
        transcribe(new Blob(chunks, { type: mime }));
      };
      rec.start();
      micBtn.classList.add("listening");
      $("hint").textContent = "Listening… let go (or tap again) when you're done.";
      if (stopWanted) stopListening();
    } catch (e) {
      rec = null;
      render({ type: "error", text: "Couldn't use the microphone: " + e.message });
    }
  }
  function stopListening() {
    stopWanted = true;
    micBtn.classList.remove("listening");
    if (rec && rec.state === "recording") rec.stop();
  }
  async function transcribe(blob) {
    micBtn.classList.add("working");
    $("hint").textContent = "Turning your voice into text…";
    try {
      const res = await fetch("/api/transcribe", { method: "POST", headers: { "Content-Type": blob.type, "X-Deck-Token": token }, body: blob });
      const data = await res.json().catch(() => ({}));
      if (data.text) await send(data.text);
      else render({ type: "error", text: data.error || "I didn't catch that. Try again." });
    } catch (e) {
      render({ type: "error", text: "Couldn't reach the Deck." });
    } finally {
      micBtn.classList.remove("working");
      $("hint").textContent = voiceHint;
    }
  }
  // Hold to talk; a quick tap instead toggles listening on and off.
  micBtn.addEventListener("pointerdown", (e) => {
    e.preventDefault();
    if (rec) return stopListening();
    pressedAt = Date.now();
    startListening();
  });
  micBtn.addEventListener("pointerup", () => {
    if (pressedAt && Date.now() - pressedAt > 400) stopListening();
    pressedAt = 0;
  });
  micBtn.addEventListener("contextmenu", (e) => e.preventDefault());
  // F8 works as a hold-to-talk key, so a Steam Input back button can be mapped to it.
  addEventListener("keydown", (e) => { if (e.key === "F8" && !e.repeat && document.body.classList.contains("voice")) { e.preventDefault(); startListening(); } });
  addEventListener("keyup", (e) => { if (e.key === "F8") stopListening(); });

  api("/api/info").then(({ data }) => {
    info = data;
    $("mode").textContent = { gaming: "Gaming Mode", desktop: "Desktop Mode" }[data.mode] || "Mode unknown";
    fillModels(data.models, data.model);
    $("authNote").textContent = data.auth === "api_key" ? "via API key" : "via Claude login";
    if (data.voice && window.isSecureContext && navigator.mediaDevices && window.MediaRecorder) {
      document.body.classList.add("voice");
      $("hint").textContent = voiceHint;
    }
    clearEmpty();
    renderEmpty();
  }).catch(() => {});
  setInterval(() => api("/api/info").then(({ data }) => {
    $("mode").textContent = { gaming: "Gaming Mode", desktop: "Desktop Mode" }[data.mode] || "Mode unknown";
  }).catch(() => {}), 15000);
  poll();
})();
</script>
</body>
</html>
